<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18352d">
  <title>村育てAI — 月を重ねる試作</title>
  <style>
    :root{--ink:#21332e;--muted:#66756f;--paper:#f5f1e7;--card:#fffdf7;--green:#2d634b;--green2:#dce9d9;--gold:#d5a84f;--line:#e4dfd2;--red:#a54f3e;--shadow:0 10px 28px #243b2e12}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    header{background:var(--ink);color:#fffdf7;padding:23px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}header h1{font-size:22px;margin:0;letter-spacing:.04em}header p{margin:3px 0 0;color:#d4dfd8;font-size:13px}.badge{border:1px solid #8ba497;border-radius:999px;padding:5px 11px;font-size:12px;white-space:nowrap}
    main{max-width:1120px;margin:24px auto;padding:0 18px 44px}.topline{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}.topline h2{margin:0;font-size:23px}.topline p{margin:4px 0 0;color:var(--muted)}.actions-top{display:flex;gap:8px;flex-wrap:wrap}
    button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:white;font-weight:650;transition:.15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button.secondary{background:#ebe7da;color:var(--ink)}button.ghost{background:transparent;color:var(--green);border:1px solid #b5c8bb}button:disabled{opacity:.42;cursor:not-allowed;transform:none}
    .layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(275px,.8fr);gap:17px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow)}.panel h3{font-size:16px;margin:0 0 13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#f7f5ee;border-radius:11px;padding:11px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:20px;margin-top:3px}.stat small{color:var(--muted);font-size:11px}.village-map{margin-top:15px;background:#e6edda;border-radius:13px;padding:13px;display:flex;gap:10px;align-items:center;min-height:92px}.map-dots{display:grid;grid-template-columns:repeat(5,19px);gap:5px;flex:none}.tile{width:19px;height:19px;border-radius:5px;background:#c7d8b7}.tile.house{background:#b87854}.tile.field{background:#d9b75b}.tile.hall{background:#628e78}.map-copy{font-size:13px;color:#4c6256}.map-copy b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
    .event{border-left:4px solid var(--gold);padding:11px 13px;background:#fbf4df;border-radius:0 11px 11px 0}.event .eyebrow{color:#806123;text-transform:uppercase;font-size:11px;font-weight:750;letter-spacing:.08em}.event h4{margin:2px 0 4px;font-size:16px}.event p{margin:0;color:#52615a;font-size:13px}.choice-list{display:grid;gap:8px;margin-top:12px}.choice{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);padding:9px 10px;border-radius:10px;background:#fff;cursor:pointer}.choice:has(input:checked){border-color:#5e9271;background:#f0f7ef}.choice input{accent-color:var(--green);margin-top:4px}.choice b{font-size:13px;display:block}.choice small{font-size:12px;color:var(--muted);display:block}
    .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.action{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer}.action:has(input:checked){border:2px solid var(--green);padding:11px;background:#f1f7ef}.action input{accent-color:var(--green);margin:0 6px 0 0}.action b{font-size:13px}.action p{font-size:12px;color:var(--muted);margin:5px 0}.cost{font-size:11px;color:#496b58;font-weight:700}.bottom-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.hint{font-size:12px;color:var(--muted)}.full{width:100%;margin-top:12px;padding:13px}
    .right-col{display:grid;align-content:start;gap:17px}.meters{display:grid;gap:12px}.meter-head{display:flex;justify-content:space-between;font-size:12px}.meter{height:8px;background:#e9e7de;border-radius:9px;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;border-radius:inherit;background:#649273}.meter.warn i{background:#c88c45}.meter.low i{background:var(--red)}.log{display:grid;gap:9px;max-height:260px;overflow:auto}.log-item{border-bottom:1px solid var(--line);padding-bottom:8px;font-size:12px;color:#56635d}.log-item b{color:var(--ink)}.log-item:last-child{border:0}.note-box{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;background:#fffdf9}.footer-note{font-size:11px;color:#7d877f;margin:15px 2px 0}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#20382e;color:white;border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);max-width:90vw;z-index:5}.screen-reader{position:absolute;clip:rect(0,0,0,0);clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
    @media(max-width:820px){.layout{grid-template-columns:1fr}.right-col{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){header{padding:17px 16px}.badge{font-size:10px}.topline{align-items:start;flex-direction:column}.actions-top{width:100%}.actions-top button{flex:1}.stats{grid-template-columns:repeat(2,1fr)}main{padding:0 12px 30px;margin-top:18px}.panel{padding:15px}.actions{grid-template-columns:1fr}.right-col{grid-template-columns:1fr}.bottom-row{align-items:stretch;flex-direction:column}.bottom-row button{width:100%}}
  </style>
</head>
<body>
  <header>
    <div><h1>村育てAI</h1><p>相談し、決めて、月を重ねる。</p></div>
    <span class="badge">遊びの核を試すブラウザー試作 0.1</span>
  </header>
  <main>
    <div class="topline">
      <div><h2 id="monthTitle">第1年・9月</h2><p id="villageLine">風待ち村 · 冬を迎える準備中</p></div>
      <div class="actions-top"><button class="secondary" id="exportBtn">セーブを書き出す</button><button class="secondary" id="importBtn">セーブを読み込む</button><button class="ghost" id="resetBtn">最初から</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
    </div>
    <div class="layout">
      <section class="panel" aria-labelledby="statusTitle">
        <h3 id="statusTitle">村の現在</h3>
        <div class="stats" id="stats"></div>
        <div class="village-map" aria-label="村の簡易図">
          <div class="map-dots" id="mapDots"></div>
          <div class="map-copy"><b>風待ち村の見取り図</b><span id="mapCopy">小さな畑と住まいが、共同広場を囲んでいる。</span></div>
        </div>
        <div style="height:18px"></div>
        <h3>今月の出来事</h3>
        <div class="event" id="eventCard"></div>
        <div class="choice-list" id="eventChoices"></div>
        <div style="height:18px"></div>
        <h3>今月、村で優先すること <span class="hint">（ひとつ）</span></h3>
        <div class="actions" id="actionList"></div>
        <div style="height:14px"></div>
        <label class="hint" for="playerNote">自由な相談・方針メモ</label>
        <textarea class="note-box" id="playerNote" placeholder="例：今年の冬は食料を優先し、住民に無理な仕事を割り当てない。"></textarea>
        <div class="bottom-row"><span class="hint" id="actionHint">施策を選び、今月を進めてください。</span><button id="advanceBtn">会議して月を進める →</button></div>
      </section>
      <aside class="right-col">
        <section class="panel"><h3>暮らしの目安</h3><div class="meters" id="meters"></div><p class="footer-note">住民の声や健康は単一の点数で決めつけず、月ごとの理由と合わせて読みます。</p></section>
        <section class="panel"><h3>村の記録</h3><div class="log" id="history" aria-live="polite"></div></section>
      </aside>
    </div>
    <p class="footer-note">この試作ではAI接続は行いません。自由記述は会議メモとして保存し、確定した数値は画面上のルールで処理します。進行状況はこのブラウザーに保存されます。</p>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
  (() => {
    const START = {
      schemaVersion: 1, scenarioId: 'first-winter', title: '冬を迎える村',
      description: '遊びの流れを試すための架空の新規シナリオ。',
      calendar: {year: 1, month: 9},
      village: {name:'風待ち村',population:42,food:190,silver:72,materials:34,housing:46,health:71,morale:64,knowledge:18,defense:12},
      unknowns:['冬の長さ','近隣勢力の行政区分','地下資源の有無'], eventCursor:0, history:[]
    };
    const SAVE_KEY = 'village-builder-ai-prototype-v1';
    const events = [
      {tag:'機会',title:'ベルン町の商人が立ち寄る',body:'商人は保存できる穀物を求めている。今なら食料20を銀貨12枚で買い取るという。',choices:[['trade','余剰分を売る','食料20を銀貨12枚に換える'],['keep','備蓄を優先する','取引せず、食料を手元に残す']]},
      {tag:'人の動き',title:'職人一家が移住を相談',body:'大人2人と子ども1人。住まいと冬の食料を用意できるか、村で検討してほしい。',choices:[['welcome','受け入れ準備を始める','食料12・資材4を使い、人口3人を迎える'],['wait','住居が整うまで待ってもらう','条件を正直に伝え、次月に再連絡する']]},
      {tag:'季節',title:'朝晩の冷え込みが強まる',body:'冬の到来が早いかもしれない。住民から暖房用の薪と屋根の手当てを求める声がある。',choices:[['prepare','共同備蓄から冬支度','銀貨6・資材3を使い、健康と安心を守る'],['observe','天候をもう一月見る','備蓄は維持。寒さの影響を注視する']]},
      {tag:'交流',title:'東の村から水車大工が来訪',body:'水車の軸を長持ちさせる修理法を教えられるという。代わりに村の作物の育て方を聞きたいそうだ。',choices:[['exchange','知識を交換する','銀貨3を使い、知識を4得る'],['decline','今回は見送る','資金を温存する']]},
      {tag:'文化',title:'ベルン町の宿屋から演目の誘い',body:'小さな舞台を一晩貸せるという。移動費はかかるが、村の芸を知ってもらう機会だ。',choices:[['perform','一座を送り出す','銀貨5を使い、銀貨11と満足度を得る'],['stay','村で稽古を続ける','費用をかけず、技芸を磨く']]},
      {tag:'暮らし',title:'薬師が共同の健康相談を提案',body:'手洗い場と薬草の記録を整えれば、冬の体調不良に早く気づけるという。',choices:[['clinic','共同相談を開く','銀貨4・資材2を使い、健康を高める'],['postpone','次の会議で予算を相談','今月は記録だけつける']]},
      {tag:'物流',title:'街道の橋板が傷んでいる',body:'通行はできるが、荷車は遠回りをしている。近隣の村と一緒に直せるかもしれない。',choices:[['repair','村の負担分を出す','銀貨6・資材5を使い、外部関係を改善'],['coordinate','共同修繕を持ちかける','直ちに費用を出さず、協議を始める']]},
      {tag:'生産',title:'農家から種の共同購入案',body:'来季の種をまとめ買いすれば安くなる。保管庫の湿気対策も先に必要だ。',choices:[['seeds','種を確保する','銀貨7を使い、知識と次季の生産力を得る'],['store','保管庫の確認を先にする','資材を使わず、記録を整える']]},
      {tag:'会議',title:'住民から冬の過ごし方の提案',body:'暖かい集会所で読み書きと音楽の会を開きたい。仕事の割り振りと休みも相談したい。',choices:[['gather','集会の準備をする','銀貨3を使い、満足度と知識を高める'],['listen','まず希望を聞き取る','費用なし。来月の議題にまとめる']]},
      {tag:'行政',title:'領の役人から村の状況照会',body:'人口、土地利用、食料備蓄について記録を求めている。用途と提出先を確認できる。',choices:[['report','帳簿を確認して回答する','銀貨2を使い、知識と行政関係を得る'],['clarify','先に照会の根拠を尋ねる','費用なし。権利関係を確認する']]},
      {tag:'市況',title:'町で保存食の需要が高まる',body:'保存食を少量納めてほしいとの問い合わせ。品質と納期を守れる量だけなら受注できそうだ。',choices:[['order','小口の注文を受ける','食料8を使い、銀貨10を得る'],['refuse','備蓄が十分になるまで断る','村の食料を守る']]},
      {tag:'年次',title:'一年の振り返り会議',body:'今年の記録を見て、村人それぞれの目標と、来年の優先順位を話し合う時期だ。',choices:[['review','全員の声を集める','銀貨3を使い、満足度と知識を得る'],['brief','短い報告会にする','費用を抑え、主要議題だけ確認する']]}
    ];
    const actions = [
      {id:'farm',name:'畑と食料',desc:'共同畑を手入れし、備蓄を増やす。',cost:{silver:4,materials:3},effect:{food:30,knowledge:1},label:'食料 +30'},
      {id:'home',name:'住居の手入れ',desc:'屋根と排水を直し、住まいの余裕を増やす。',cost:{silver:6,materials:5},effect:{housing:8,morale:3},label:'住居 +8・満足 +3'},
      {id:'market',name:'商いと物産',desc:'村の品を整え、近隣との小さな取引を増やす。',cost:{silver:3,materials:1},effect:{silver:13,morale:1},label:'銀貨 +13'},
      {id:'health',name:'健康と衛生',desc:'水場・手洗い・薬草記録を整える。',cost:{silver:5,materials:2},effect:{health:7,morale:2},label:'健康 +7・満足 +2'},
      {id:'school',name:'寺小屋と技術',desc:'読み書き、算術、仕事の知恵を共有する。',cost:{silver:4,materials:1},effect:{knowledge:6,morale:1},label:'知識 +6・満足 +1'},
      {id:'arts',name:'芸と祭り',desc:'舞台、音楽、遊びを続けて村のつながりを育てる。',cost:{silver:4,materials:1},effect:{morale:7,silver:4},label:'満足 +7・銀貨 +4'}
    ];
    const labels={population:'人口',food:'食料',silver:'銀貨',materials:'資材',housing:'住居',health:'健康',morale:'満足',knowledge:'知識',defense:'備え'};
    const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);
    const load=()=>{try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));return s&&s.schemaVersion===1?s:structuredClone(START)}catch{return structuredClone(START)}};
    let state=load(); let pickedAction=null; let pickedChoice=null;
    const $=id=>document.getElementById(id);
    const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,n));
    const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const currentEvent=()=>events[state.eventCursor%events.length];
    function render(){
      $('monthTitle').textContent=`第${state.calendar.year}年・${state.calendar.month}月`;
      $('villageLine').textContent=`${state.village.name} · ${state.title}`;
      const v=state.village;
      const ids=['population','food','silver','materials','housing','health','morale','knowledge'];
      $('stats').innerHTML=ids.map(k=>`<div class="stat"><span>${labels[k]}</span><strong>${fmt(v[k])}${k==='silver'?'枚':''}</strong><small>${k==='population'?'村に暮らす人':k==='food'?'冬越しの備蓄':k==='housing'?`定員目安 ${fmt(v[k])}人`:k==='materials'?'木材・石材など':'村の共有状況'}</small></div>`).join('');
      const m=[['食料',v.food,Math.min(300,v.food),`目安: 月の消費 ${Math.max(1,Math.ceil(v.population*.16))}`],['住居',v.housing,Math.min(100,v.housing),`人口 ${v.population}人`],['健康',v.health,v.health,'診療と衛生'],['満足',v.morale,v.morale,'住民の声と合わせて確認']];
      $('meters').innerHTML=m.map(([name,val,pct,sub])=>`<div><div class="meter-head"><b>${name}</b><span>${fmt(val)} <span class="hint">${sub}</span></span></div><div class="meter ${pct<30?'low':pct<55?'warn':''}"><i style="width:${clamp(pct/3,2,100)}%"></i></div></div>`).join('');
      const e=currentEvent(); $('eventCard').innerHTML=`<div class="eyebrow">${e.tag}</div><h4>${e.title}</h4><p>${e.body}</p>`;
      $('eventChoices').innerHTML=e.choices.map(([id,title,desc],i)=>`<label class="choice"><input type="radio" name="eventChoice" value="${id}" ${i===0?'checked':''}><span><b>${title}</b><small>${desc}</small></span></label>`).join('');
      pickedChoice=e.choices[0][0]; document.querySelectorAll('input[name="eventChoice"]').forEach(el=>el.addEventListener('change',()=>pickedChoice=el.value));
      $('actionList').innerHTML=actions.map(a=>`<label class="action"><input type="radio" name="action" value="${a.id}"><b>${a.name}</b><p>${a.desc}</p><span class="cost">費用 ${Object.entries(a.cost).map(([k,n])=>`${labels[k]} ${n}`).join(' · ')} / ${a.label}</span></label>`).join('');
      pickedAction=null; document.querySelectorAll('input[name="action"]').forEach(el=>el.addEventListener('change',()=>{pickedAction=actions.find(a=>a.id===el.value);checkReady()}));
      $('actionHint').textContent='施策をひとつ選んでください。';
      $('history').innerHTML=state.history.length?state.history.slice().reverse().map(x=>`<div class="log-item"><b>${escapeHTML(x.date)}</b><br>${escapeHTML(x.text)}</div>`).join(''):'<div class="hint">ここに会議と月次結果が記録されます。</div>';
      renderMap(); $('advanceBtn').disabled=true; localStorage.setItem(SAVE_KEY,JSON.stringify(state));
    }
    function renderMap(){
      const arr=Array.from({length:25},(_,i)=>i); $('mapDots').innerHTML=arr.map((i)=>`<span class="tile ${i%7===1?'house':i===17?'field':i===12?'hall':''}"></span>`).join('');
      $('mapCopy').textContent=`家 ${Math.max(3,Math.ceil(state.village.population/12))}軒 · 畑 ${Math.max(1,Math.ceil(state.village.food/100))}区画 · 広場 1か所`;
    }
    function checkReady(){if(!pickedAction)return;$('advanceBtn').disabled=false;const lacking=Object.entries(pickedAction.cost).filter(([k,n])=>state.village[k]<n);$('actionHint').textContent=lacking.length?`不足: ${lacking.map(([k,n])=>`${labels[k]} ${n-state.village[k]}`).join('、')}`:`${pickedAction.name}を実施できます。`;$('advanceBtn').disabled=!!lacking.length;}
    function apply(delta){for(const [k,n] of Object.entries(delta)){if(k in state.village){state.village[k]+=n;if(['health','morale','knowledge','defense'].includes(k))state.village[k]=clamp(state.village[k]);}}}
    function eventEffect(choice){const e=currentEvent(),v=state.village;let text='';
      switch(choice){
        case'trade': if(v.food>=20){apply({food:-20,silver:12});text='余剰食料20を売り、銀貨12枚を得た。'}else{text='備蓄が足りず、取引は成立しなかった。'}break;
        case'welcome':if(v.food>=12&&v.materials>=4){apply({food:-12,materials:-4,population:3,morale:2});text='住居と食料の準備を始め、職人一家3人を迎えた。'}else{text='資材か食料が足りず、移住時期を再相談することにした。'}break;
        case'prepare':if(v.silver>=6&&v.materials>=3){apply({silver:-6,materials:-3,health:3,morale:3});text='冬支度の備蓄を整えた。'}else{text='冬支度の予算が不足し、できる範囲の点検に留めた。'}break;
        case'exchange':if(v.silver>=3){apply({silver:-3,knowledge:4});text='水車の修理知識と作物の育て方を交換した。'}else{text='旅費が足りず、次の機会に持ち越した。'}break;
        case'perform':if(v.silver>=5){apply({silver:6,morale:3});text='町での小公演が好評。旅費を差し引き、銀貨6枚の差額が残った。'}else{text='移動費が足りず、出演を見送った。'}break;
        case'clinic':if(v.silver>=4&&v.materials>=2){apply({silver:-4,materials:-2,health:5});text='薬師の健康相談を開き、衛生の記録を始めた。'}else{text='必要な備品が不足し、相談会は延期した。'}break;
        case'repair':if(v.silver>=6&&v.materials>=5){apply({silver:-6,materials:-5,knowledge:1});text='村の負担分を出し、橋の共同修繕に加わった。'}else{text='負担分が足りず、費用の相談を続ける。'}break;
        case'seeds':if(v.silver>=7){apply({silver:-7,knowledge:2});text='来季の種を確保し、保管方法も確認した。'}else{text='予算が足りず、種の購入は見送った。'}break;
        case'gather':if(v.silver>=3){apply({silver:-3,morale:4,knowledge:2});text='集会所で読み書きと音楽の会を開いた。'}else{text='費用をかけない聞き取り会に切り替えた。'}break;
        case'report':if(v.silver>=2){apply({silver:-2,knowledge:2});text='帳簿を照合して回答し、土地利用の記録を整えた。'}else{text='帳簿の確認を優先し、回答は次月に回した。'}break;
        case'order':if(v.food>=8){apply({food:-8,silver:10});text='保存食の小口注文を納め、銀貨10枚を得た。'}else{text='食料備蓄を優先し、注文を丁寧に断った。'}break;
        case'review':if(v.silver>=3){apply({silver:-3,morale:3,knowledge:2});text='住民の目標を聞き、来年の議題を記録した。'}else{text='予算を使わず、短い目標共有を行った。'}break;
        case'keep':text='取引を見送り、食料備蓄を守った。';break;
        case'wait':text='移住希望者に住居の状況を説明し、再連絡を約束した。';break;
        case'observe':text='天候と健康の変化を記録することにした。';break;
        case'decline':text='今回は交流を見送った。';break;
        case'stay':text='村で稽古を続けた。';break;
        case'postpone':text='要望を次回会議の議題に載せた。';break;
        case'coordinate':text='近隣村へ共同修繕の相談を送った。';break;
        case'store':text='保管庫の湿気と重量を点検した。';break;
        case'listen':text='住民の希望を聞き、休みと集会の案を記録した。';break;
        case'clarify':text='照会の根拠と土地利用条件を問い合わせた。';break;
        case'refuse':text='備蓄を守るため、注文を断った。';break;
        case'brief':text='主要議題の短い報告会を開いた。';break;
      }
      state.eventCursor++;return text;
    }
    function advance(){if(!pickedAction)return;const a=pickedAction,v=state.village;for(const[k,n]of Object.entries(a.cost))v[k]-=n;apply(a.effect);const eventText=eventEffect(pickedChoice);const upkeep=Math.ceil(v.population*.16);v.food=Math.max(0,v.food-upkeep);v.silver=Math.round(v.silver*10)/10;const shortage=v.food===0?` 食料が底をついた。次月は備蓄の確保が急務だ。`:` 月の食料消費${upkeep}を差し引いた。`;const note=$('playerNote').value.trim();const text=`${a.name}を実施。${eventText}${shortage}${note?` 相談メモ「${note}」`:''}`;const date=`${state.calendar.year}年${state.calendar.month}月`;state.history.push({date,text,choice:a.id,event:pickedChoice,delta:{...v}});if(state.history.length>36)state.history=state.history.slice(-36);state.calendar.month++;if(state.calendar.month>12){state.calendar.month=1;state.calendar.year++;apply({morale:2});} $('playerNote').value='';render();window.scrollTo({top:0,behavior:'smooth'});showToast(`${date}の会議を記録しました。${text}`);}
    function showToast(message){const t=$('toast');t.textContent=message;t.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.hidden=true,4200)}
    $('advanceBtn').addEventListener('click',advance);
    $('resetBtn').addEventListener('click',()=>{if(confirm('このブラウザーの試作セーブを消して、最初から始めますか？')){state=structuredClone(START);localStorage.removeItem(SAVE_KEY);pickedAction=null;render();}});
    $('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.village.name}_save.json`;a.click();URL.revokeObjectURL(a.href);showToast('現在の村の状態を書き出しました。');});
    $('importBtn').addEventListener('click',()=>$('importFile').click());
    $('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());const required=['population','food','silver','materials','housing','health','morale','knowledge','defense'];if(incoming.schemaVersion!==1||!incoming.calendar||!incoming.village||!Number.isInteger(incoming.calendar.year)||!Number.isInteger(incoming.calendar.month)||incoming.calendar.month<1||incoming.calendar.month>12||required.some(k=>!Number.isFinite(incoming.village[k]))||!Array.isArray(incoming.history)||!Number.isInteger(incoming.eventCursor)||incoming.eventCursor<0)throw new Error('形式が合いません');state=incoming;render();showToast('セーブを読み込みました。');}catch(err){showToast(`読み込めませんでした: ${err.message}`);}finally{e.target.value='';}});
    render();
  })();
  </script>
